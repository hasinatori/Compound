# CI: собирает фронт и backend при пуше в main.
# CI: builds frontend + backend on push to main.
# Комментарии тут — только напоминание; секреты в разметке НЕ храним.
# Comments here are reminders only; never put secrets in this file.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/

  backend:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  bundle:
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: amd64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm tauri build --target x86_64-unknown-linux-gnu
          echo "linux artifacts"
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
      - name: Windows build
        if: matrix.os == 'windows-latest'
        run: |
          pnpm tauri build
          echo "windows artifacts"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn