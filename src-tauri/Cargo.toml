[package]
name = "compound"
version = "1.0.0"
description = "Compound – flotter Dateimanager (Tauri)"
authors = ["sam"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary to avoid a name clash with the bin target on Windows.
name = "compound_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

walkdir = "2"
ignore = "0.4"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled-full"] }

tar = "0.4"
flate2 = "1"
zip = { version = "1", default-features = false, features = ["deflate"] }
bzip2 = "0.4"
xz2 = "0.1"

rayon = "1"
regex = "1"
notify = "6"
dirs = "5"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
portable-pty = "0.8"
libc = "0.2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
once_cell = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
